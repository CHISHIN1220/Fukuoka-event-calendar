<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福岡イベントカレンダー</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#252a31;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header,main{max-width:1050px;margin:auto;padding:22px}h1{font-size:30px;margin:0 0 4px}.sub{font-size:12px;color:#777;letter-spacing:.13em}.month{display:grid;grid-template-columns:1fr 1.2fr 1fr;text-align:center;align-items:center;margin:22px 0 16px;border-bottom:1px solid #ddd;padding-bottom:12px}.month button{border:0;background:none;color:#1677df;font-size:15px;padding:10px;cursor:pointer}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{border:1px solid #d5dbe1;border-radius:7px;padding:11px;font-size:14px;background:white}.filters input{flex:1;min-width:190px}.status{display:flex;justify-content:space-between;color:#777;font-size:12px;margin:12px 0}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}th{text-align:left;font-size:12px;color:#59616b;border-bottom:1px solid #ccd1d7;padding:10px 8px}td{padding:11px 8px;border-bottom:1px solid #ddd;vertical-align:top;overflow-wrap:anywhere}th:nth-child(1){width:25%}th:nth-child(2){width:45%}th:nth-child(3){width:30%}a{color:#222;text-decoration:none;font-weight:650}.meta{display:block;color:#777;font-size:11px;margin-top:4px}.empty{text-align:center;padding:35px;color:#777}footer{border-top:1px solid #ddd;margin-top:25px;padding:16px 0;color:#777;font-size:12px;line-height:1.8}@media(max-width:620px){header,main{padding:16px}h1{font-size:25px}table{font-size:12px}th,td{padding:9px 5px}th:nth-child(1){width:28%}th:nth-child(2){width:42%}th:nth-child(3){width:30%}.status{display:block}}.venuebox{margin:4px 0 6px}.venuehead{font-size:12px;color:#59616b;margin-bottom:6px}.venues{display:flex;flex-wrap:wrap;gap:7px 14px;border:1px solid #d5dbe1;border-radius:7px;padding:10px 12px;max-height:132px;overflow:auto}.venues label{font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer}.venues input{width:16px;height:16px}
@media print{.filters,.venuebox,.month button,footer button{display:none}}
</style></head><body><header><h1>福岡イベントカレンダー</h1><div class="sub">FUKUOKA EVENT INFORMATION</div></header><main>
<nav class="month"><button id="prev">前月へ</button><strong id="month">読み込み中</strong><button id="next">翌月へ</button></nav>
<div class="filters"><input id="q" placeholder="イベント名・会場・地域で検索"><select id="cat"><option value="">すべてのジャンル</option><option>ライブ・コンサート</option><option>スポーツ</option><option>祭り・地域イベント</option><option>展示会・学会</option><option>舞台・演劇</option><option>その他</option></select><select id="area"><option value="">福岡県全域</option><option>福岡</option><option>北九州</option><option>筑後</option><option>筑豊</option></select></div>
<div class="venuebox"><div class="venuehead">会場（複数選択可）</div><div id="venues" class="venues">読み込み中</div></div>
<div class="status"><span id="count">イベント情報を読み込み中</span><span id="updated"></span></div>
<table><thead><tr><th>期間</th><th>イベント名</th><th>場所</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>この月のイベントは見つかりませんでした。</div>
<footer>掲載情報は公開情報をもとにしています。開催日時・内容は変更される場合があります。お出かけ前に必ず主催者・会場の公式情報をご確認ください。<br><button onclick="window.print()">印刷する</button></footer></main>
<script>
let events=[],month=new Date();month.setDate(1);const $=x=>document.getElementById(x),days="日月火水木金土";
function date(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function label(e){let a=date(e.startDate),b=date(e.endDate||e.startDate);if(!a)return"日程確認中";let f=d=>`${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;return f(a)+(b&&a.toDateString()!=b.toDateString()?" ～ "+f(b):"")}
function draw(){$("month").textContent=`${month.getFullYear()}年${month.getMonth()+1}月`;let q=$("q").value.toLowerCase().trim(),cat=$("cat").value,area=$("area").value,venue=new Set([...document.querySelectorAll("#venues input:checked")].map(x=>x.value)),a=new Date(month.getFullYear(),month.getMonth(),1),b=new Date(month.getFullYear(),month.getMonth()+1,0,23,59,59);let list=events.filter(e=>{let s=date(e.startDate),z=date(e.endDate||e.startDate);return s&&z&&s<=b&&z>=a&&(!cat||e.category===cat)&&(!area||(e.area||"").includes(area))&&(!venue.size||venue.has(e.venue))&&(!q||[e.name,e.venue,e.area].join(" ").toLowerCase().includes(q))}).sort((x,y)=>x.startDate.localeCompare(y.startDate));$("rows").innerHTML=list.map(e=>`<tr><td>${label(e)}</td><td><a href="${esc(e.url||"#")}" target="_blank" rel="noopener">${esc(e.name)}</a><span class="meta">${esc(e.category||"その他")}${e.source?" ・情報元："+esc(e.source):""}</span></td><td>${esc(e.venue||"会場確認中")}<span class="meta">${esc(e.area||"福岡県")}</span></td></tr>`).join("");$("count").textContent=`${list.length}件のイベント`;$("empty").hidden=list.length>0}
async function load(){try{let r=await fetch("./data/events.json?"+Date.now());let j=await r.json();events=j.events||[];let cnt={};events.forEach(e=>{if(e.venue)cnt[e.venue]=(cnt[e.venue]||0)+1});let prio=["みずほPayPayドーム福岡","マリンメッセ福岡"];let vs=Object.keys(cnt).sort((x,y)=>{let px=prio.indexOf(x),py=prio.indexOf(y);if(px>=0||py>=0)return(px<0?99:px)-(py<0?99:py);return(cnt[y]-cnt[x])||x.localeCompare(y,"ja")});let cur=new Set([...document.querySelectorAll("#venues input:checked")].map(x=>x.value));$("venues").innerHTML=vs.map(v=>`<label><input type="checkbox" value="${esc(v)}"${cur.has(v)?" checked":""}>${esc(v)}（${cnt[v]}）</label>`).join("");$("updated").textContent=j.updatedAt?"更新："+new Date(j.updatedAt).toLocaleString("ja-JP"):"自動収集の初回実行待ち"}catch(e){$("updated").textContent="イベントデータを読み込めません"}draw()}
$("prev").onclick=()=>{month.setMonth(month.getMonth()-1);draw()};$("next").onclick=()=>{month.setMonth(month.getMonth()+1);draw()};["q","cat","area"].forEach(x=>$(x).addEventListener(x==="q"?"input":"change",draw));$("venues").addEventListener("change",draw);load();
</script></body></html>
