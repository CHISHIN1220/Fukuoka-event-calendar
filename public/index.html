</style></head><body><div class="hakata-stripe"></div><header><div class="hero-inner"><h1>福岡イベントカレンダー</h1><div class="sub">FUKUOKA EVENT INFORMATION</div><p class="hero-desc">福岡県内で開催されるライブ・コンサート、スポーツ、舞台・演劇、展示会、祭り・地域イベントの情報を月ごとにまとめています。会場やジャンルで絞り込んで探せます。</p></div><svg class="skyline" viewBox="0 0 1200 58" preserveAspectRatio="none" aria-hidden="true"><path d="M0 58 L0 44 L120 44 L120 38 L210 38 L210 44 L330 44 L330 30 L345 30 L345 44 L470 44 Q545 12 620 44 L760 44 L760 40 L820 40 L820 44 L900 44 L900 26 L906 26 L906 20 L912 26 L918 26 L918 44 L1010 44 L1010 36 L1090 36 L1090 44 L1200 44 L1200 58 Z" fill="#0d2440" opacity="0.85"/><rect x="896" y="6" width="4" height="20" fill="#0d2440" opacity="0.85"/><rect x="880" y="26" width="36" height="3" fill="#0d2440" opacity="0.85"/><rect x="884" y="34" width="28" height="3" fill="#0d2440" opacity="0.85"/><circle cx="1040" cy="30" r="3" fill="#ffb347"/><circle cx="1062" cy="30" r="3" fill="#ffb347"/><rect x="1028" y="36" width="56" height="3" fill="#0d2440" opacity="0.85"/></svg></header><main>
<nav class="month"><button id="prev">前月へ</button><strong id="month">読み込み中</strong><button id="next">翌月へ</button></nav>
<div class="filters"><input id="q" placeholder="イベント名・会場・地域で検索"><select id="cat"><option value="">すべてのジャンル</option><option>ライブ・コンサート</option><option>スポーツ</option><option>展示会・学会</option><option>舞台・演劇</option><option>その他</option></select><select id="area"><option value="">福岡県全域</option><option>福岡</option><option>北九州</option><option>筑後</option><option>筑豊</option></select><button id="festBtn" class="festbtn off" type="button">地域イベント<b id="festState">OFF</b></button><button id="todayBtn" class="festbtn off" type="button">本日開催<b id="todayState">OFF</b></button></div>

<div class="hakata-stripe" style="margin-top:25px;border-radius:2px"></div>
<footer>掲載情報は公開情報をもとにしています。開催日時・内容は変更される場合があります。お出かけ前に必ず主催者・会場の公式情報をご確認ください。<br><button onclick="window.print()">印刷する</button><div style="text-align:center;margin-top:12px"><img src="https://hits.sh/chishin1220.github.io/Fukuoka-event-calendar.svg?label=%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B9%E6%95%B0&labelColor=555555&color=1677df" alt="サイトアクセス数"></div></footer></main>
<script>
let events=[],month=new Date();month.setDate(1);const $=x=>document.getElementById(x),days="日月火水木金土";
function date(s){if(!s)return null;let d=new Date(s);return isNaN(d)?null:d}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function label(e){let a=date(e.startDate),b=date(e.endDate||e.startDate);if(!a)return"日程確認中";let f=d=>`${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;return f(a)+(b&&a.toDateString()!=b.toDateString()?" ～ "+f(b):"")}
function tt(e){let s=date(e.startDate),o=[],m=(e.description||"").match(/開場\s*(\d{1,2}):(\d{2})/);if(m)o.push("開場 "+m[1]+":"+m[2]);if(s&&(s.getHours()||s.getMinutes())){let lb=(e.category==="スポーツ"||e.category==="祭り・地域イベント"||e.category==="展示会・学会")?"開始":"開演";o.push(lb+" "+String(s.getHours()).padStart(2,"0")+":"+String(s.getMinutes()).padStart(2,"0"))}return o.map(t=>`<span class="tm">${t}</span>`).join("")}
const vgroup=v=>v==="マリンメッセ福岡B館"?"マリンメッセ福岡":v;let festOn=false,todayOn=false,dayOff=0;function draw(){if(todayOn){$("month").textContent=dayOff===0?"本日開催":(()=>{let td=new Date();td.setDate(td.getDate()+dayOff);return (td.getMonth()+1)+"月"+td.getDate()+"日（"+"日月火水木金土"[td.getDay()]+")"})()}else{$("month").textContent=`${month.getFullYear()}年${month.getMonth()+1}月`}$("prev").textContent=todayOn?"前日へ":"前月へ";$("next").textContent=todayOn?"翌日へ":"翌月へ";let q=$("q").value.toLowerCase().trim(),cat=$("cat").value,area=$("area").value,venue=new Set([...document.querySelectorAll("#venues input:checked")].map(x=>x.value)),a=new Date(month.getFullYear(),month.getMonth(),1),b=new Date(month.getFullYear(),month.getMonth()+1,0,23,59,59),t0=new Date();t0.setHours(0,0,0,0);let t1=new Date();t1.setHours(23,59,59,999);t0.setDate(t0.getDate()+dayOff);t1.setDate(t1.getDate()+dayOff);let list=events.filter(e=>{let s=date(e.startDate),z=date(e.endDate||e.startDate);return s&&z&&(todayOn?(s<=t1&&z>=t0):(s<=b&&z>=a))&&(!cat||e.category===cat)&&(festOn||e.category!=="祭り・地域イベント")&&(!area||(e.area||"").includes(area))&&(!venue.size||venue.has(vgroup(e.venue)))&&(!q||[e.name,e.venue,e.area].join(" ").toLowerCase().includes(q))}).sort((x,y)=>x.startDate.localeCompare(y.startDate));$("rows").innerHTML=list.map(e=>`<tr><td>${label(e)}${tt(e)}</td><td><a href="${esc(e.url||"#")}" target="_blank" rel="noopener">${esc(e.name)}</a><span class="meta">${esc(e.category==="祭り・地域イベント"?"地域イベント":(e.category||"その他"))}${e.source?`<span class="src"> ・情報元：${esc(e.source)}</span>`:""}</span></td><td>${e.venue?'<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.venue)+'" target="_blank" rel="noopener">'+esc(e.venue)+'</a>':"会場確認中"}<span class="meta">${esc(e.area||"福岡県")}</span></td></tr>`).join("");$("count").textContent=`${list.length}件のイベント`;$("empty").hidden=list.length>0}
async function load(){try{let r=await fetch("./data/events.json?"+Date.now());let j=await r.json();events=j.events||[];let cnt={};events.forEach(e=>{if(e.venue){let g=vgroup(e.venue);cnt[g]=(cnt[g]||0)+1}});let vs=Object.keys(cnt).sort((x,y)=>(cnt[y]-cnt[x])||x.localeCompare(y,"ja"));let cur=new Set([...document.querySelectorAll("#venues input:checked")].map(x=>x.value));$("venues").innerHTML=vs.map(v=>`<label><input type="checkbox" value="${esc(v)}"${cur.has(v)?" checked":""}>${esc(v)}</label>`).join("");$("updated").textContent=j.updatedAt?"更新："+new Date(j.updatedAt).toLocaleString("ja-JP"):"自動収集の初回実行待ち"}catch(e){$("updated").textContent="イベントデータを読み込めません"}draw()}
$("prev").onclick=()=>{if(todayOn){dayOff--}else{month.setMonth(month.getMonth()-1)}draw()};$("next").onclick=()=>{if(todayOn){dayOff++}else{month.setMonth(month.getMonth()+1)}draw()};["q","cat","area"].forEach(x=>$(x).addEventListener(x==="q"?"input":"change",draw));$("venues").addEventListener("change",draw);$("festBtn").onclick=()=>{festOn=!festOn;$("festBtn").classList.toggle("off",!festOn);$("festState").textContent=festOn?"ON":"OFF";draw()};$("todayBtn").onclick=()=>{todayOn=!todayOn;dayOff=0;$("todayBtn").classList.toggle("off",!todayOn);$("todayState").textContent=todayOn?"ON":"OFF";draw()};load();
</script></body></html>
